# ==============================================================================
# yt-dlp Configuration for Live Stream Recording & Long-Term Reliability
# Automatically loaded by yt-dlp.exe in this directory
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Network & Resilience (Prevents hanging & recovers from dropouts)
# ------------------------------------------------------------------------------
--socket-timeout 30
--retries 10
--fragment-retries 10
--retry-sleep fragment:exp=1:5
--file-access-retries 5
--extractor-retries 5

# ------------------------------------------------------------------------------
# 2. Live Stream Capture & Auto-Cut Behavior
# ------------------------------------------------------------------------------
# Start from beginning of DVR window if stream is already ongoing
--live-from-start
# Wait if scheduled (poll every 10s until live)
--wait-for-video 10
# Continuous MPEG-TS container while downloading (prevents corruption on sudden drop)
--hls-use-mpegts
# Speed up catching up to live head from backlog
--concurrent-fragments 4
# Only download the single video/live stream even if URL contains &list=...
--no-playlist

# ------------------------------------------------------------------------------
# 3. Post-Processing & Conversion
# ------------------------------------------------------------------------------
# Remux stream copy to MP4 immediately after stream cuts (zero CPU re-encoding)
--remux-video mp4

# ------------------------------------------------------------------------------
# 4. Windows File System & Storage Safety
# ------------------------------------------------------------------------------
# Sanitize illegal characters (: \ / * ? " < > |) in titles
--windows-filenames
# Prevent exceeding Windows MAX_PATH (260 characters)
--trim-filenames 150
# Automatically record downloaded video IDs to prevent duplicate recording
--download-archive "downloads/archive.txt"
# Keep temporary fragments inside downloads/temp instead of polluting root directory
--paths "temp:downloads/temp"
# Organized output path by channel and date
-o "downloads/%(channel,uploader)s/%(upload_date>%Y-%m-%d,release_date>%Y-%m-%d)s - %(title)s [%(id)s].%(ext)s"

# ------------------------------------------------------------------------------
# 5. Authentication (if cookies.txt exists in this folder)
# ------------------------------------------------------------------------------
--cookies "cookies.txt"

# ------------------------------------------------------------------------------
# 6. Quality & Resolution (Capped at 480p for efficiency & bandwidth savings)
# ------------------------------------------------------------------------------
-f "bv*[height<=480]+ba/b[height<=480] / best[height<=480] / best"
-S "res:480,fps"
