name: Deterministic verification

on:
  push:
    branches: ["**"]
    paths:
      - "sim/**"
      - "tools/**"
      - "schemas/**"
      - "scripts/**"
      - "requirements*.txt"
      - "Makefile"
      - "audit.bat"
      - "audit.sh"
      - "sim.bat"
      - "sim.sh"
      - ".github/workflows/verification.yml"
  pull_request:
    paths:
      - "sim/**"
      - "tools/**"
      - "schemas/**"
      - "scripts/**"
      - "requirements*.txt"
      - "Makefile"
      - "audit.bat"
      - "audit.sh"
      - "sim.bat"
      - "sim.sh"
      - ".github/workflows/verification.yml"
  workflow_dispatch:

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Validate ecosystem manifest
        run: python tools/validate_ecosystem.py
      - name: Reconciliation audit & ledger certification
        run: python sim/reconciliation_engine.py --ledger
      - name: Dynamic simulation test suite regression
        run: python -m unittest discover -s sim -p "test_*.py"
      - name: Task telemetry regression
        run: python sim/task_telemetry.py --test
      - name: Upload verification ledger artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dual-layer-verification-ledger
          path: research/results/dual_layer_verification_ledger.json
