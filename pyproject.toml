[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "github-pilot"
version = "0.1.0"
description = "Autonomous Macro-Plane GitHub Profile, Fleet Health & Ecosystem Navigator"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Aaradhya Dev Tamrakar", email = "contact@aaradhyadt.dev" }
]
keywords = ["github", "automation", "profile-readme", "fleet-management", "mcp", "scraper"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx[http2]>=0.27.0",
    "selectolax>=0.3.21",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
pilot = "pilot.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["pilot*"]
exclude = ["assets*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
