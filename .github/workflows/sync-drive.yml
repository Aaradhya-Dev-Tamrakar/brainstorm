name: Continuous Google Drive Documentation Sync

on:
  push:
    branches:
      - main
    paths:
      - '**.md'
      - 'report/**'
      - 'research/**'
      - 'drive-manifest.json'
      - 'scripts/sync_drive.py'
      - '.github/workflows/sync-drive.yml'
  workflow_dispatch:

concurrency:
  group: drive-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-to-drive:
    name: Sync Markdown to Google Drive
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute In-Place Google Drive Sync
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_CLIENT_SECRET_JSON: ${{ secrets.GDRIVE_CLIENT_SECRET_JSON }}
        run: |
          python scripts/sync_drive.py

      - name: Commit Manifest Updates If Modified
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git status --porcelain drive-manifest.json | grep -q 'drive-manifest.json'; then
            git add drive-manifest.json
            git commit -m 'chore(drive): update drive-manifest.json hashes and metadata [skip ci]'
            if git push origin main; then
              echo "Successfully pushed manifest updates directly to main."
            else
              echo "Direct push to main was blocked. Creating sync branch and pull request..."
              git checkout -b chore/drive-manifest-sync
              git push -u origin chore/drive-manifest-sync --force
              if gh pr list --head chore/drive-manifest-sync --json number --jq '.[0].number' | grep -q '^[0-9]'; then
                echo "Pull request already exists for chore/drive-manifest-sync."
              else
                gh pr create --title "chore(drive): update drive-manifest.json hashes and metadata" \
                             --body "Automated manifest synchronization from continuous Google Drive sync." \
                             --base main \
                             --head chore/drive-manifest-sync || echo "Notice: Automated PR creation skipped due to repository action permissions. Branch 'chore/drive-manifest-sync' is pushed and available."
              fi
            fi
          else
            echo 'No manifest changes to commit.'
          fi

